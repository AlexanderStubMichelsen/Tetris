name: Build APK release

# Builds a signed APK and publishes it as a GitHub Release.
# Latest download: https://github.com/AlexanderStubMichelsen/Tetris/releases/latest/download/Tetris.apk
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.APP_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "$KEYSTORE_B64" | base64 -d > $RUNNER_TEMP/apps.p12
          UNSIGNED=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign --ks $RUNNER_TEMP/apps.p12 --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias machinemal-apps \
            --out Tetris.apk aligned.apk
          "$BT/apksigner" verify --print-certs Tetris.apk | head -3
          rm -f $RUNNER_TEMP/apps.p12

      - name: Read version
        id: v
        run: |
          NAME=$(grep -m1 -oE 'versionName *=? *"[^"]+"' app/build.gradle* | grep -oE '"[^"]+"' | tr -d '"')
          echo "tag=v${NAME}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "name=Tetris ${NAME} (build ${{ github.run_number }})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: ${{ steps.v.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Tetris.apk
          body: |
            Android app, signed APK for direct install (not on Google Play).

            **Install:** download `Tetris.apk` on your Android phone, open it, and allow
            "Install unknown apps" for your browser when Android asks.
